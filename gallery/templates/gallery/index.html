{% verbatim %}<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bizning muzey</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a0a14;--panel:rgba(30,12,23,.92);--rose:#f0cfc8;--brass:#d2a85c;--ivory:#faf1e6;--line:rgba(210,168,92,.35);color-scheme:dark;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--ink:#1a0a14}}
:root[data-theme="dark"]{--ink:#1a0a14}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--ivory);font-family:'Fraunces',Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas#c{display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.b{background:var(--brass);color:#2a1220;border-radius:999px;padding:.85rem 2.2rem;font-size:1.1rem;font-weight:600;box-shadow:0 8px 30px rgba(210,168,92,.35)}
.g{border:1px solid var(--line);border-radius:999px;padding:.5rem 1rem;font-size:.9rem;background:rgba(26,10,20,.6);backdrop-filter:blur(8px)}
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 45%,rgba(26,10,20,.35),rgba(26,10,20,.88) 75%);transition:opacity .8s}
#intro .pin{font-size:clamp(2.8rem,8vw,4.2rem);line-height:1;margin-bottom:.7rem;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(3deg)}}
#intro h1{font-weight:400;font-size:clamp(2.6rem,9vw,6rem);line-height:1.05;margin:0 0 1rem;color:var(--rose);text-shadow:0 4px 40px rgba(0,0,0,.6)}
#intro p{font-style:italic;max-width:32rem;line-height:1.65;margin:0 0 2.2rem;font-size:1.1rem}
#intro .pinote{font-style:normal;font-size:.95rem;opacity:.75;margin:-1.4rem 0 2rem}
#cog{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:9}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none;display:none}
#hud>*{pointer-events:auto}
#mm{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;border:1px solid var(--line);border-radius:14px;background:rgba(26,10,20,.6);backdrop-filter:blur(8px)}
#hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-style:italic;font-size:.9rem;opacity:.75;white-space:nowrap}
#dp{position:absolute;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px}
#dp button{border-radius:20px;background:rgba(210,168,92,.82);color:#2a1220;font-size:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,.4);touch-action:none}
#dp button:active{background:var(--rose)}
#dp .u{grid-column:2}
@media (pointer:coarse),(max-width:800px){#dp{display:grid}#hint{display:none}}
#lb{position:fixed;inset:0;z-index:12;background:rgba(14,5,10,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lb img{max-width:92vw;max-height:74vh;border:10px solid var(--brass);border-radius:3px;box-shadow:0 20px 80px #000}
#lb p{font-style:italic;font-size:1.4rem;margin:1.1rem 0 0;color:var(--rose);text-align:center}
.b:disabled{opacity:.6;cursor:wait}
#tools{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:8px}
#tools .g{font-size:1.1rem;padding:.45rem .8rem}#tools .g.on{background:var(--brass);color:#2a1220}
#gy{display:none}@media (pointer:coarse){#gy{display:inline-block}}
#lb{overflow:auto;justify-content:flex-start}
#lb img{max-height:54vh;margin-top:auto}
#lb .meta{max-width:min(92vw,42rem);text-align:center;margin:1rem 0 auto;padding-bottom:20px}
#lb #lt{font-size:1.5rem;color:var(--rose);font-style:italic}
#lb #ld{display:block;opacity:.7;margin:.2rem 0 .6rem;font-size:.95rem}
#lb #ls{font-size:1.05rem;line-height:1.6;margin:.4rem 0 1rem;font-style:normal;color:var(--ivory);white-space:pre-line}
.act{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.act input{font:inherit;color:var(--ivory);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:.55rem 1rem;min-width:0;flex:1 1 200px;max-width:320px;-webkit-user-select:text;user-select:text}
.act button{border:1px solid var(--line);border-radius:999px;padding:.5rem 1rem;background:rgba(26,10,20,.6)}
.act button.on{background:#c94b6d;border-color:#c94b6d}
.meta small,#letter small{display:block;margin-top:8px;min-height:1.2em;opacity:.8}
.cl{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;font-size:1.4rem;padding:8px 12px;color:var(--ivory)}
#letter{position:fixed;inset:0;z-index:13;background:rgba(14,5,10,.94);display:none;align-items:center;justify-content:center;padding:16px}
#letter .paper{position:relative;background:#f6ead8;color:#3a1a2a;border-radius:6px;padding:2.2rem 1.6rem 1.6rem;max-width:36rem;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 80px #000;-webkit-user-select:text;user-select:text}
#letter h2{font-weight:600;font-size:1.9rem;margin:0 0 .4rem;text-align:center}
#lc{text-align:center;font-size:1.1rem;color:#9a3d5e;margin-bottom:1rem}
#lp{white-space:pre-line;line-height:1.75;font-size:1.1rem;margin:0 0 1.4rem}
#letter .act input{background:#fff;color:#3a1a2a;border-color:#caa}
#letter .act button{background:#7a3f56;color:#fff;border:0}
#letter .cl{color:#3a1a2a}
#vidbox{position:fixed;inset:0;z-index:14;background:rgba(10,4,8,.96);display:none;align-items:center;justify-content:center;padding:18px}
#vidbox video{max-width:94vw;max-height:82vh;border:8px solid var(--brass);border-radius:4px;box-shadow:0 20px 80px #000;background:#000}
#vidbox .cl{color:var(--ivory)}
#vidbox p{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-style:italic;opacity:.7;font-size:.9rem}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro"><div class="pin">🐧</div><h1 id="ttl"></h1><p id="sub"></p><p class="pinote">Kichik pingvin sizni muzey boʻylab olib yuradi.</p><button class="b" id="go">Muzeyga kirish</button></div>
<div id="hud">
  <canvas id="mm" width="130" height="130"></canvas>
  <div id="tools"><button class="g" id="snd" aria-label="Ovozni oʻchirish">🔊</button><button class="g" id="gy" aria-label="Giroskop bilan qarash">🧭</button></div>
  <div id="hint">W A S D — pingvinni yuritish · sudrash — burilish · rasmni bosing</div>
  <div id="dp"><button class="u" id="bu" aria-label="Oldinga">▲</button><button id="bl" aria-label="Chapga burilish">◀</button><button id="bd" aria-label="Orqaga">▼</button><button id="br" aria-label="Oʻngga burilish">▶</button></div>
</div>
<div id="lb"><button class="cl" id="lx" aria-label="Yopish">✕</button><img alt=""><div class="meta"><b id="lt"></b><time id="ld"></time><p id="ls"></p><div class="act" id="gb"><button id="hb">♥ Yoqdi</button><input id="ci" maxlength="300" placeholder="Izoh qoldiring…" aria-label="Izoh"><button id="cs">Yuborish</button></div><small id="cm"></small></div></div>
<div id="letter"><div class="paper"><button class="cl" id="lx2" aria-label="Yopish">✕</button><h2 id="lh"></h2><div id="lc"></div><p id="lp"></p><div class="act"><input id="li" maxlength="300" placeholder="Menga bir ogʻiz soʻz yozing…" aria-label="Xabar"><button id="ls2">Yuborish</button></div><small id="lm"></small></div></div>
<div id="vidbox"><button class="cl" id="vx" aria-label="Yopish">✕</button><video id="vv" playsinline controls preload="metadata"></video><p>Xat oldidagi xotira videosi</p></div>
<audio id="bg" loop preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CELL=4, H=4.6, PRESET=null;
const D=[[0,-1],[1,0],[0,1],[-1,0]];
const PAL={rose:{n:'Atirgul',w:'#7a3f56',a:'#d9a0b4'},night:{n:'Tun',w:'#27325c',a:'#8f9ee0'},gold:{n:'Shampan',w:'#9c8160',a:'#f0dcb4'},green:{n:'Zumrad',w:'#2f5a4c',a:'#9fd0bd'}};
const FALLBACK=['#########','#S......#','#######.#','#.......#','#.#######','#.......#','#######.#','#.......#','#########'];
let S=PRESET||{layout:'winding',pal:'rose',title:'Bizning muzey',sub:'Har bir surat — birga oʻtkazgan bir lahzamiz. Sevgilim, bu zal faqat sen uchun.',photos:[],music:'',video:'',map:FALLBACK,letter:{title:'',text:'',since:''}};
const $=s=>document.querySelector(s);

// xarita yordamchilari
const startOf=m=>{let f=null;for(let z=0;z<m.length;z++){const x=m[z].indexOf('S');if(x>=0)return[x,z];if(!f){const y=m[z].indexOf('.');if(y>=0)f=[y,z]}}return f||[1,1]};
const fl=(m,x,z)=>!!(m[z]&&x>=0&&x<m[z].length&&m[z][x]!=='#');
function slotsOf(m){const st=startOf(m),seen={},dep={},q=[st],out=[];seen[st]=1;dep[st]=0;
 while(q.length){const[x,z]=q.shift(),k=x+','+z;
  for(const[dx,dz]of D){const nx=x+dx,nz=z+dz,nk=nx+','+nz;
   if(fl(m,nx,nz)){if(!seen[nk]){seen[nk]=1;dep[nk]=dep[k]+1;q.push([nx,nz])}}
   else out.push({x,z,dx,dz,d:dep[k]})}}
 out.sort((a,b)=>a.d-b.d);return out}
function drawMap(cv,m,px,pz,yw){const g=cv.getContext('2d'),w=m[0].length,h=m.length,s=Math.min(cv.width/w,cv.height/h),ox=(cv.width-w*s)/2,oy=(cv.height-h*s)/2;
 g.clearRect(0,0,cv.width,cv.height);
 m.forEach((r,z)=>[...r].forEach((c,x)=>{if(c!=='#'){g.fillStyle=c==='S'?'#d2a85c':'rgba(240,207,200,.85)';g.fillRect(ox+x*s+.5,oy+z*s+.5,s-1,s-1)}}));
 if(px!=null){g.save();g.translate(ox+px/CELL*s,oy+pz/CELL*s);g.rotate(-yw);g.fillStyle='#d2a85c';g.beginPath();g.moveTo(0,-s*.45);g.lineTo(s*.3,s*.3);g.lineTo(-s*.3,s*.3);g.fill();g.restore()}}

// 3D
const cv=$('#c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a0a14);scene.fog=new THREE.Fog(0x1a0a14,6,26);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,90);cam.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0xffe9d6,0x3a1c2c,1.0));
const lantern=new THREE.PointLight(0xffd9a8,1.25,16,1.4);scene.add(lantern);
// shiftdagi chiroqlar: koʻrinadigan lampalar har katakda, haqiqiy nur esa eng yaqin 5 tasida (tezlik uchun)
let lamps=[];const lightPool=[];
for(let i=0;i<5;i++){const l=new THREE.PointLight(0xffe2b0,0,14,1.3);scene.add(l);lightPool.push(l)}
function updateLamps(){
 if(!lamps.length){lightPool.forEach(l=>l.intensity=0);return}
 const near=[];
 for(const p of lamps){const d=(p.x-px)*(p.x-px)+(p.z-pz)*(p.z-pz);
  if(near.length<lightPool.length||d<near[near.length-1].d){near.push({p,d});near.sort((a,b)=>a.d-b.d);if(near.length>lightPool.length)near.pop()}}
 lightPool.forEach((l,i)=>{const n=near[i];if(n){l.position.set(n.p.x,H-.7,n.p.z);l.intensity=1.15}else l.intensity=0})
}
const mk=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return c};
const wallTex=p=>new THREE.CanvasTexture(mk(256,256,g=>{g.fillStyle=p.w;g.fillRect(0,0,256,256);g.strokeStyle=p.a;g.globalAlpha=.22;g.lineWidth=2;
 for(let y=0;y<256;y+=64)for(let x=0;x<256;x+=64){g.beginPath();g.moveTo(x+32,y);g.lineTo(x+64,y+32);g.lineTo(x+32,y+64);g.lineTo(x,y+32);g.closePath();g.stroke()}
 g.globalAlpha=1;g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,236,256,20);g.fillStyle='#d2a85c';g.fillRect(0,234,256,3)}));
const floorT=new THREE.CanvasTexture(mk(256,256,g=>{for(let i=0;i<8;i++){g.fillStyle=i%2?'#4d2e1e':'#412618';g.fillRect(i*32,0,32,256);g.fillStyle='rgba(0,0,0,.4)';g.fillRect(i*32,0,2,256)}}));
floorT.wrapS=floorT.wrapT=THREE.RepeatWrapping;
const label=(t,w,h,px)=>{const c=mk(1024,Math.round(1024*h/w),g=>{g.fillStyle='#f0cfc8';g.font=`italic ${px}px Fraunces,Georgia,serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(t,512,g.canvas.height/2)});
 return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}))};
const artTex=i=>{const t=new THREE.CanvasTexture(mk(800,600,g=>{const h=(i*47+330)%360,gr=g.createLinearGradient(0,0,800,600);gr.addColorStop(0,`hsl(${h},55%,28%)`);gr.addColorStop(1,`hsl(${(h+50)%360},60%,62%)`);g.fillStyle=gr;g.fillRect(0,0,800,600);
 for(let k=0;k<12;k++){g.fillStyle=`hsla(${(h+k*20)%360},70%,75%,.16)`;g.beginPath();g.arc((k*137+i*90)%800,(k*89+i*60)%600,40+(k*23)%110,0,7);g.fill()}
 g.fillStyle='rgba(255,240,235,.88)';g.beginPath();g.moveTo(400,363);g.bezierCurveTo(288,286,344,216,400,268);g.bezierCurveTo(456,216,512,286,400,363);g.fill()}));return t};

// pingvin — muzey boʻylab yuradigan yoʻlboshchi (yumshoq, haqiqiyga yaqin shakl)
function makePenguin(){
 const g=new THREE.Group();
 const sm=(x,a,b)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
 const feather=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.72,metalness:.03});
 const black=new THREE.MeshStandardMaterial({color:0x161c28,roughness:.66,metalness:.04});
 const cream=new THREE.MeshStandardMaterial({color:0xf4eddf,roughness:.82});
 const orange=new THREE.MeshStandardMaterial({color:0xd9761f,roughness:.5});
 const orange2=new THREE.MeshStandardMaterial({color:0xb85a12,roughness:.58});
 const dark=new THREE.MeshBasicMaterial({color:0x0b0d12});
 const eyeRing=new THREE.MeshStandardMaterial({color:0xd9d8d1,roughness:.35,metalness:.08});
 const shine=new THREE.MeshBasicMaterial({color:0xffffff});

 // tana: bir silliq lathe — pastda keng, boʻyinda ingichka
 const prof=[[0,.04],[.14,.06],[.24,.11],[.32,.19],[.385,.30],[.43,.44],[.448,.60],[.442,.74],[.42,.86],[.385,.96],[.34,1.04],[.29,1.10],[.255,1.15],[.18,1.18],[0,1.19]];
 const geo=new THREE.LatheGeometry(prof.map(p=>new THREE.Vector2(p[0],p[1])),36);
 const pos=geo.attributes.position,col=[],cb=new THREE.Color(0x121724),cw=new THREE.Color(0xf7f2e6),tmp=new THREE.Color();
 for(let i=0;i<pos.count;i++){
  const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i),r=Math.hypot(x,z)||1;
  const front=sm(-z/r,.50,.86), top=.84+.03*front;
  const w=front*sm(y,.10,.26)*(1-sm(y,top,top+.18));
  tmp.copy(cb).lerp(cw,w);col.push(tmp.r,tmp.g,tmp.b);
 }
 geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
 g.add(new THREE.Mesh(geo,feather));

 // bosh: alohida, yon tomonga qarab burila oladi
 const head=new THREE.Group();head.position.y=1.218;g.add(head);
 const hd=new THREE.Mesh(new THREE.SphereGeometry(.248,32,24),black);hd.scale.set(1,1.01,.97);head.add(hd);
 const face=new THREE.Mesh(new THREE.SphereGeometry(.118,22,16),cream);
 face.scale.set(1.30,.94,.30);face.position.set(0,-.018,-.226);head.add(face);
 [1,-1].forEach(s=>{
  const rim=new THREE.Mesh(new THREE.SphereGeometry(.036,16,12),eyeRing);rim.scale.set(1,.94,.42);rim.position.set(.082*s,.04,-.277);head.add(rim);
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.025,14,12),dark);eye.scale.set(1,.96,.58);eye.position.set(.082*s,.04,-.291);head.add(eye);
  const glint=new THREE.Mesh(new THREE.SphereGeometry(.008,8,8),shine);glint.position.set(.075*s,.05,-.307);head.add(glint);
 });
 const beakBase=new THREE.Mesh(new THREE.SphereGeometry(.075,18,12),orange2);beakBase.position.set(0,-.066,-.245);beakBase.scale.set(1.22,.72,.72);head.add(beakBase);
 const beak=new THREE.Mesh(new THREE.SphereGeometry(.078,20,14),orange);beak.position.set(0,-.07,-.298);beak.scale.set(1.38,.68,1.08);head.add(beak);
 const lowerBeak=new THREE.Mesh(new THREE.SphereGeometry(.055,16,10),orange2);lowerBeak.position.set(0,-.101,-.29);lowerBeak.scale.set(1.16,.35,.82);head.add(lowerBeak);

 // qanotlar: yelka nuqtasidan osilgan, yurishda tebranadi
 const flipper=(()=>{
  const sh=new THREE.Shape();sh.moveTo(0,0);
  sh.bezierCurveTo(.075,-.10,.085,-.38,.028,-.60);
  sh.quadraticCurveTo(0,-.655,-.028,-.60);
  sh.bezierCurveTo(-.085,-.38,-.075,-.10,0,0);
  const fg=new THREE.ExtrudeGeometry(sh,{depth:.06,bevelEnabled:true,bevelThickness:.018,bevelSize:.016,bevelSegments:2,curveSegments:14});
  fg.translate(0,0,-.03);return fg;
 })();
 const wings=[1,-1].map(s=>{
  const p=new THREE.Group();p.position.set(.38*s,.93,.01);
  const w=new THREE.Mesh(flipper,black);w.rotation.z=.22*s;p.add(w);
  g.add(p);return p;
 });

 // oyoqlar: kaft va uch barmoq
 const feet=[1,-1].map(s=>{
  const p=new THREE.Group();p.position.set(.155*s,.022,-.01);
  const palm=new THREE.Mesh(new THREE.SphereGeometry(.13,18,12),orange);
  palm.scale.set(1.5,.34,1.62);palm.position.set(0,0,-.05);p.add(palm);
  [-.062,0,.062].forEach((dx,k)=>{
   const toe=new THREE.Mesh(new THREE.SphereGeometry(.047,12,8),orange2);
   toe.scale.set(1.0,.5,1.9);toe.position.set(dx,.004,-.21-(k===1?.015:0));toe.rotation.y=dx*1.7;p.add(toe);
  });
  g.add(p);return p;
 });

 const tail=new THREE.Mesh(new THREE.ConeGeometry(.10,.22,10),black);
 tail.position.set(0,.20,.37);tail.rotation.x=1.32;g.add(tail);

 // yumshoq soya
 const sc=mk(128,128,c=>{const gr=c.createRadialGradient(64,64,4,64,64,62);gr.addColorStop(0,'rgba(0,0,0,.55)');gr.addColorStop(.55,'rgba(0,0,0,.24)');gr.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=gr;c.fillRect(0,0,128,128)});
 const sh=new THREE.Mesh(new THREE.PlaneGeometry(1.35,1.1),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
 sh.rotation.x=-Math.PI/2;sh.position.y=.009;g.add(sh);
 return {g,wings,feet,head};
}
const peng=makePenguin();scene.add(peng.g);

let world,pick=[],curMap=FALLBACK,items=[],pend=0,vidEl=null;
function ensureVideo(){
 if(vidEl||!S.video)return;
 vidEl=document.createElement('video');
 vidEl.src=S.video;vidEl.loop=true;vidEl.muted=true;vidEl.playsInline=true;vidEl.preload='auto';
 vidEl.setAttribute('playsinline','');vidEl.setAttribute('webkit-playsinline','');
 vidEl.play().catch(()=>{});
}
function build(){
 if(world){scene.remove(world);world.traverse(o=>o.geometry&&o.geometry.dispose())}
 world=new THREE.Group();scene.add(world);pick=[];items=[];pend=0;
 const m=Array.isArray(S.map)&&S.map.length?S.map:FALLBACK;
 curMap=m;
 const st=startOf(m),p=PAL[S.pal]||PAL.rose,w=Math.max(...m.map(r=>r.length)),h=m.length;
